<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Damage Detection AI</title>

<style>
:root {
  --bg: #0b1220;
  --panel: #111827;
  --card: #1f2937;
  --border: #374151;
  --accent: #3b82f6;
  --danger: #ef4444;
  --text: #f9fafb;
  --muted: #9ca3af;
}

:root {
  --bg: #0b1220;
  --panel: #111827;
  --card: #1f2937;
  --border: #374151;
  --accent: #3b82f6;
  --danger: #ef4444;
  --text: #f9fafb;
  --muted: #9ca3af;
}

body {
  margin: 0;
  font-family: "Inter", sans-serif;
  background: var(--bg);
  color: var(--text);
}

/* Layout */
.app {
  display: grid;
  grid-template-columns: 300px 1fr;
  height: 100vh;
}

/* Sidebar */
.sidebar {
  background: var(--panel);
  padding: 20px;
  border-right: 1px solid var(--border);
}

.sidebar h2 {
  margin: 0 0 20px;
}

.upload-box {
  border: 2px dashed var(--border);
  padding: 20px;
  text-align: center;
  border-radius: 10px;
  cursor: pointer;
}

.upload-box:hover {
  border-color: var(--accent);
}

input {
  display: none;
}

button {
  width: 100%;
  margin-top: 15px;
  padding: 10px;
  border: none;
  background: var(--accent);
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

.status {
  margin-top: 15px;
  font-size: 13px;
  color: var(--muted);
}

/* Main Area */
.main {
  padding: 20px;
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  font-size: 20px;
  margin-bottom: 15px;
}

/* Canvas */
.canvas-container {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

canvas {
  max-width: 100%;
}

/* Stats */
.stats {
  display: flex;
  gap: 10px;
  margin-top: 15px;
}

.stat {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  padding: 12px;
  border-radius: 8px;
}

.stat b {
  display: block;
  font-size: 14px;
  color: var(--muted);
}

.stat span {
  font-size: 18px;
  font-weight: bold;
}

/* Labels */
.labels {
  margin-top: 10px;
}

.label {
  display: inline-block;
  background: var(--danger);
  padding: 4px 8px;
  margin: 3px;
  border-radius: 5px;
  font-size: 12px;
}
</style>

</head>

<body>

<div class="app">

<!-- Sidebar -->

<div class="sidebar">
  <h2>🚗 Damage AI</h2>

  <div class="upload-box" onclick="document.getElementById('file').click()">
    <p>Upload Image</p>
    <input type="file" id="file" accept="image/*">
  </div>

<button onclick="detect()">Run Detection</button>

  <div class="status" id="status">Status: Idle</div>
</div>

<!-- Main -->

<div class="main">

  <div class="header">Detection Dashboard</div>

  <div class="canvas-container">
    <canvas id="canvas"></canvas>
  </div>

  <div class="stats">
    <div class="stat">
      <b>Total Damage</b>
      <span id="damage">-</span>
    </div>
    <div class="stat">
      <b>Detections</b>
      <span id="count">-</span>
    </div>
    <div class="stat">
      <b>Severity</b>
      <span id="severity">-</span>
    </div>
  </div>

  <div class="labels" id="labels"></div>

</div>

</div>

<script>
const api = "";

async function detect() {
  const file = document.getElementById("file").files[0];
  const status = document.getElementById("status");

  if (!file) {
    status.textContent = "Status: Please upload image";
    return;
  }

  status.textContent = "Status: Processing...";

  try {
    const fd = new FormData();
    fd.append("file", file);

    const res = await fetch(api + "/predict", {
      method: "POST",
      body: fd
    });

    const data = await res.json();

    draw(file, data);
    update(data);

    status.textContent = "Status: Completed";

  } catch (e) {
    status.textContent = "Status: Error";
  }
}

function draw(file, data) {
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const img = new Image();
  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);

    data.detections.forEach(d => {
      const [x1,y1,x2,y2] = d.bbox;

      ctx.strokeStyle = "red";
      ctx.strokeRect(x1,y1,x2-x1,y2-y1);

      ctx.fillText(d.label, x1, y1-5);
    });
  };

  img.src = URL.createObjectURL(file);
}

function update(data) {
  document.getElementById("damage").textContent =
    data.total_damage_percent + "%";

  document.getElementById("count").textContent =
    data.detections.length;

  document.getElementById("severity").textContent =
    data.total_damage_percent > 50 ? "High" :
    data.total_damage_percent > 20 ? "Medium" : "Low";

  const labels = document.getElementById("labels");
  labels.innerHTML = "";

  data.detections.forEach(d => {
    const el = document.createElement("span");
    el.className = "label";
    el.textContent = d.label;
    labels.appendChild(el);
  });
}
</script>

</body>
</html>
